[workspace]
resolver = "2"
members = ["contracts/escrow", "contracts/mock_token"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PulseRun-Labs/pulserun-core"
homepage = "https://pulserun.com"
authors = ["PulseRun Labs <eng@pulserun.com>"]

[workspace.dependencies]
soroban-sdk = "28.0.0"

# Optimized profile for Soroban WASM deployments: shrink the binary, keep
# overflow checks on so settlement math can never silently wrap.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
