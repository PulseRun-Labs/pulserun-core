<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="PulseRun Core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b1a"/>
      <stop offset="100%" stop-color="#1a0933"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7D00FF"/>
      <stop offset="100%" stop-color="#FF4DA6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <polyline points="60,150 200,150 250,80 300,210 350,110 400,180 450,150 560,150"
            fill="none" stroke="url(#pulse)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="600" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">PulseRun Core</text>
  <text x="602" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#b9a7d8">Pay-per-run escrow &amp; settlement on Stellar</text>
</svg>
