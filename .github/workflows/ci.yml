name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to keep CI cheap.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint-and-test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: wasm32v1-none

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --all --locked

  wasm:
    name: build wasm32v1-none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32v1-none

      # Soroban SDK 28+ requires `stellar contract build` (spec shaking); plain
      # `cargo build` is not a supported way to produce a deployable contract.
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v30.0.1

      - name: Build contracts
        run: stellar contract build

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulserun-contracts-wasm
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
          retention-days: 14
