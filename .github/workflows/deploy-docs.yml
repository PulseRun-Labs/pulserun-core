name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# `pages: write` lets configure-pages read the Pages config and deploy-pages
# publish it; `id-token: write` is required for the Pages OIDC deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; do not cancel an in-flight one, since
# the queued run would otherwise replace a half-finished deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the site is verified against; bump deliberately.
      # mdBook 0.5.x rejects config keys that 0.4.x accepted, so an
      # unpinned "latest" can break the build on an upstream release.
      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.5.4"
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          mdbook --version

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build the book
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
